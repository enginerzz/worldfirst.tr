<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yükleniyor...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; }
    h1 { color: #111; margin-bottom: 20px; }
    .meta { font-size: 0.9em; color: #666; margin-bottom: 30px; }
    .content { font-size: 1.1em; white-space: pre-line; }
    .loading { text-align: center; padding: 50px; color: #888; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">İçerik yükleniyor...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://eawwgvklwuhqsbwwcqdc.supabase.co'; // Proje URL'in
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhd3dndmtsd3VocXNid3djcWRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTU5NjcsImV4cCI6MjEwNTMzMTk2N30.sySmKTHrMxdhB7locmhUQqwjoWK2Sipqlxxqo7Slc7I'; // Anon/Public Key

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadArticle() {
      const today = new Date().toISOString().split('T')[0];
      let domain = window.location.hostname.replace('www.', '');

      // Yerel testlerde veya GitHub Pages alt alan adlarında varsayılan test domaini
      if (domain === 'localhost' || domain.includes('github.io')) {
        domain = 'riyadhair.com.tr'; 
      }

      const { data, error } = await supabase
        .from('articles')
        .select('title, content, created_at')
        .eq('domain', domain)
        .order('date', { ascending: false })
        .limit(1)
        .maybeSingle();

      const appEl = document.getElementById('app');

      if (error || !data) {
        appEl.innerHTML = '<h1>İçerik Bulunamadı</h1><p>Bu alan adı için henüz yayınlanmış bir yazı bulunmuyor.</p>';
        return;
      }

      document.title = data.title;
      appEl.innerHTML = `
        <h1>${data.title}</h1>
        <div class="meta">Yayınlanma Tarihi: ${new Date(data.created_at).toLocaleDateString('tr-TR')}</div>
        <div class="content">${data.content}</div>
      `;
    }

    loadArticle();
  </script>
</body>
</html>
